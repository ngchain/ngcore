name: CI
on:
  push:
    branches: [ dev ]
defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ngcore
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: x86_64-linux
            os: ubuntu-latest
            goarch: amd64
          - build: x86_64-macos
            os: macos-latest
            goarch: amd64
          - build: x86_64-windows
            os: windows-latest
            goarch: amd64
            # unix-only tests (file perms, path format, deleting open db
            # files) don't hold on windows; build + vet it, test on linux/macos
            notest: true
          - build: aarch64-linux
            os: ubuntu-latest
            goarch: arm64
            cross: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      # the aarch64 binary is a pure-Go cross-compile (CGO off), so vet/test
      # run on the native x86_64 entries and this one only produces the binary
      - name: Analysis ngcore
        if: ${{ !matrix.cross }}
        run: go vet ./...

      - name: Test ngcore
        if: ${{ !matrix.cross && !matrix.notest }}
        run: go test -p 1 ./...

      - name: Build ngcore
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go build ./cmd/ngcore


      # ... and now perform some goop to move all the relevant artifacts into
      # something that we'll upload from this action.
      - run: mkdir dist

      # Move `ngcore` or `ngcore.exe` to dist folder
      - run: cp ngcore* dist

      - uses: actions/upload-artifact@v4
        with:
          name: ngcore-${{ matrix.build }}
          path: dist

  # Consumes all published artifacts from all the previous build steps, creates
  # a bunch of tarballs for all of them, and then publishes the tarballs
  # themselves as an artifact (for inspection) and then optionally creates
  # github releases and/or tags for pushes.
  publish:
    name: Publish
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v4 downloads every run artifact into its own ngcore-<platform>/
      # subfolder, which is the layout build-tarballs.sh expects
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      # Assemble all the build artifacts into tarballs and zip archives.
      - name: Assemble tarballs
        run: |
          bash ./.github/tools/build-tarballs.sh x86_64-linux
          bash ./.github/tools/build-tarballs.sh x86_64-windows zip
          bash ./.github/tools/build-tarballs.sh x86_64-macos
          bash ./.github/tools/build-tarballs.sh aarch64-linux
      # Upload all assembled tarballs as an artifact of the github action run, so
      # that way even PRs can inspect the output.
      - uses: actions/upload-artifact@v4
        with:
          name: tarballs
          path: dist

      - name: Calculate tag name
        run: |
          name=dev
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            name=${GITHUB_REF:10}
          fi
          echo ::set-output name=val::$name
          echo name=TAG::$name >> $GITHUB_ENV
        id: tagname

      # ... and if this was an actual push (vXX.XX.XX tag only) then we publish a
      # new release. This'll automatically publish a tag release or update `dev`
      # with this `sha`
      - name: Publish Release
        uses: ./.github/actions/github-release
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v'))
        with:
          files: "dist/*"
          name: ${{ steps.tagname.outputs.val }}
          token: ${{ secrets.GITHUB_TOKEN }}

